<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fractal Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#090d19;color:#e9eefc;font:16px system-ui}main{max-width:1000px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}small{color:#53e3d4;letter-spacing:3px;font-size:11px}h1{font-size:30px;margin:8px 0}p{color:#94a4bf;font-size:14px}button{background:#202b48;border:1px solid #445678;border-radius:12px;padding:12px 20px;color:#fff;font:inherit}canvas{display:block;width:100%;height:64vh;border:1px solid #293452;border-radius:18px;box-shadow:0 18px 60px #0008;touch-action:none;background:#060917}footer{display:flex;justify-content:space-between;color:#7e91b0;font-size:12px;margin-top:18px}b{color:#53e3d4}</style><main><header><div><small>FRACTAL LAB / 01</small><h1>Mandelbrot</h1></div><button id="reset">Reset ↺</button></header><p>An infinite coastline of color. Tap anywhere to dive deeper.</p><canvas id="c"></canvas><footer><span id="info">Rendering…</span><span>LOCAL · <b>OFFLINE</b></span></footer></main><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),info=document.getElementById('info');let cx=-.5,cy=0,span=3.5,level=0,job=0;
function render(){const token=++job,w=c.width=Math.min(760,Math.round(c.clientWidth*devicePixelRatio)),h=c.height=Math.round(w*c.clientHeight/c.clientWidth),im=ctx.createImageData(w,h),limit=220+level*45;let row=0;info.textContent='Rendering…';function chunk(){if(token!==job)return;let end=Math.min(h,row+24);for(;row<end;row++)for(let x=0;x<w;x++){let a=cx+(x/w-.5)*span,b=cy+(row/h-.5)*span*h/w,zr=0,zi=0,n=0;while(zr*zr+zi*zi<256&&n<limit){let t=zr*zr-zi*zi+a;zi=2*zr*zi+b;zr=t;n++}let k=4*(row*w+x);if(n===limit){im.data[k]=6;im.data[k+1]=9;im.data[k+2]=23}else{let v=n+1-Math.log2(Math.log2(Math.hypot(zr,zi))),t=v*.065;im.data[k]=Math.round(128+127*Math.cos(t+1));im.data[k+1]=Math.round(128+127*Math.cos(t+2.8));im.data[k+2]=Math.round(128+127*Math.cos(t+4.5))}im.data[k+3]=255}ctx.putImageData(im,0,0);if(row<h)requestAnimationFrame(chunk);else info.textContent='Zoom '+Math.pow(2.5,level).toFixed(1)+'× · '+limit+' iterations'}requestAnimationFrame(chunk)}
c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();cx+=((e.clientX-r.left)/r.width-.5)*span;cy+=((e.clientY-r.top)/r.height-.5)*span*c.height/c.width;span/=2.5;level++;render()});document.getElementById('reset').onclick=()=>{cx=-.5;cy=0;span=3.5;level=0;render()};window.addEventListener('resize',render);render();
</script></html>
