name: ianautomat
options:
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ianautomat:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fuba.ianautomat
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
  ianautomatTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ianautomat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fuba.ianautomat.tests
        GENERATE_INFOPLIST_FILE: YES
  ianautomatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ianautomat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fuba.ianautomat.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ianautomat:
    build:
      targets:
        ianautomat: all
    test:
      targets:
        - ianautomatTests
        - ianautomatUITests
