name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    name: Validate release source
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/ci.yml
  publish:
    name: Sign and publish APK
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Verify checkout release cooldown before execution
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
          $release = Invoke-RestMethod 'https://api.github.com/repos/actions/checkout/releases/tags/v7.0.1' -Headers $headers
          if ($release.draft -or $release.prerelease -or ([DateTimeOffset]::UtcNow - [DateTimeOffset]::Parse($release.published_at)).TotalDays -lt 7) { throw 'Checkout release is inside its seven-day cooldown.' }
          $ref = (Invoke-RestMethod 'https://api.github.com/repos/actions/checkout/git/ref/tags/v7.0.1' -Headers $headers).object
          while ($ref.type -eq 'tag') { $ref = (Invoke-RestMethod "https://api.github.com/repos/actions/checkout/git/tags/$($ref.sha)" -Headers $headers).object }
          if ($ref.sha -ne '3d3c42e5aac5ba805825da76410c181273ba90b1') { throw 'Checkout tag no longer matches its reviewed commit.' }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use preinstalled Java 21
        run: '"ANAUTOMAT_JAVA_HOME=$env:JAVA_HOME_21_X64" >> $env:GITHUB_ENV'
      - name: Verify release dependencies and policy
        run: |
          python scripts/ci-security.py verify
          if ($LASTEXITCODE -ne 0) { throw 'Dependency checks failed' }
          python scripts/ci-security.py policy
          if ($LASTEXITCODE -ne 0) { throw 'Repository policy failed' }
      - name: Build APK with persistent release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$') { throw 'Release tag must be vMAJOR.MINOR.PATCH (each component 0-999).' }
          $version = $env:RELEASE_TAG.Substring(1)
          $versionCode = [int]$Matches[1]*1000000 + [int]$Matches[2]*1000 + [int]$Matches[3]
          if ($versionCode -lt 1) { throw 'Version code must be positive.' }
          if (!$env:ANDROID_KEYSTORE_BASE64) { throw 'Release signing key is missing.' }
          $env:ANDROID_KEYSTORE_PATH = Join-Path $env:RUNNER_TEMP 'anautomat-release.p12'
          try {
            [IO.File]::WriteAllBytes($env:ANDROID_KEYSTORE_PATH,[Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            ./scripts/build.ps1 -Release -Version $version -VersionCode $versionCode
          } finally {
            if (Test-Path -LiteralPath $env:ANDROID_KEYSTORE_PATH) { Remove-Item -LiteralPath $env:ANDROID_KEYSTORE_PATH -Force }
          }
      - name: Attest APK build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/anautomat.apk
      - name: Publish GitHub Release
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create $env:RELEASE_TAG build/anautomat.apk build/SHA256SUMS --draft --verify-tag --title "anautomat $env:RELEASE_TAG" --notes-file .github/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release' }
